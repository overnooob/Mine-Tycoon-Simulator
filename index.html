<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine Tycoon Simulator</title>
<style>
:root{--bg:#dfe8ff;--card:#fff;--ink:#1b2340;--mut:#5b6588;--acc:#ff9f1c;--acc2:#2ec4b6;--line:#c3cff2;--bad:#e63946;--good:#2a9d5c;--bar:#e3e9fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--card:#1a2040;--ink:#eef1ff;--mut:#9aa5d1;--line:#2c3566;--bar:#262e5a}}
:root[data-theme="dark"]{--bg:#10142a;--card:#1a2040;--ink:#eef1ff;--mut:#9aa5d1;--line:#2c3566;--bar:#262e5a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:10px 12px 86px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.row{display:flex;gap:8px;align-items:center}
.pill{flex:1;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800}
.pill small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.bar{height:12px;background:var(--bar);border-radius:8px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc2);width:0;transition:width .15s}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
h2{margin:6px 0;font-size:18px}p{margin:4px 0;color:var(--mut);font-size:13px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:#1b2340;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.45;cursor:not-allowed}
button.g{background:var(--good);color:#fff}button.s{background:var(--bar);color:var(--ink)}
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.zones button{white-space:nowrap;flex:1}
.zones button.on{outline:3px solid var(--acc2)}
#rockWrap{position:relative;display:flex;justify-content:center;padding:14px 0}
#rock{width:190px;height:190px;border-radius:50%;font-size:96px;line-height:1;background:radial-gradient(circle at 35% 30%,var(--card),var(--bar));border:5px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.2)}
#rock.hit{animation:hit .12s}@keyframes hit{50%{transform:scale(.9) rotate(-4deg)}}
.fl{position:fixed;pointer-events:none;font-weight:900;color:var(--acc);text-shadow:0 2px 0 rgba(0,0,0,.5);animation:fl .8s forwards;z-index:20}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.grid{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--bar);border-radius:10px;padding:5px 9px;font-weight:700;font-size:13px}
.up{display:flex;gap:10px;align-items:center}.up .ic{font-size:34px}.up .mid{flex:1}
.pips{display:flex;gap:3px;margin-top:5px}.pips b{flex:1;height:8px;border-radius:4px;background:var(--bar)}.pips b.f{background:var(--acc2)}
.Common{border-color:#8d99ae}.Rare{border-color:#3a86ff}.Epic{border-color:#9b5de5}.Legendary{border-color:#ffb703}
.pet{display:inline-block;width:calc(33.3% - 6px);margin:3px;text-align:center;background:var(--bar);border:3px solid;border-radius:12px;padding:8px 2px;cursor:pointer;font-size:12px;font-weight:700;position:relative}
.pet.on{background:var(--acc2);color:#10142a}.pet span{font-size:34px;display:block}.pet u{position:absolute;right:4px;top:0;text-decoration:none;color:var(--bad);font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:3px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav div{display:flex;gap:6px;width:100%;max-width:560px}nav button{flex:1;padding:8px 2px;font-size:12px}nav button.on{background:var(--acc2)}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:800;padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.ver{color:var(--acc);font-weight:900}
html:root:root{--bg:#1a0f3d;--card:#2a1b66;--ink:#fff;--mut:#bfb3f5;--acc:#ffd23f;--acc2:#22e6b8;--line:#5a3fd1;--bar:#3b2a8f;--good:#25c26e;--bad:#ff4d6d}
body{background:radial-gradient(circle at 15% 0,#4b2bb8 0,transparent 45%),radial-gradient(circle at 90% 100%,#0a8f9c 0,transparent 40%),var(--bg);background-attachment:fixed}
.hud{background:transparent;backdrop-filter:blur(6px)}
.pill,.card{background:linear-gradient(180deg,#3a2792,#2a1b66);border:0;border-radius:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 6px 0 #150a3a}
h2{color:var(--acc);text-shadow:0 2px 0 rgba(0,0,0,.35)}
button{background:linear-gradient(180deg,#ffe36e,#ffb703);border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 #b36f00;text-transform:uppercase;letter-spacing:.4px;font-size:13px}
button.g{background:linear-gradient(180deg,#5af2a0,#16a864);color:#04281a;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #0b6b3f}
button.s{background:linear-gradient(180deg,#5a45c9,#3b2a8f);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 5px 0 #1e1250}
button:active{transform:translateY(4px);box-shadow:none}
nav{background:#150a3a;border-top:0}nav button.on{background:linear-gradient(180deg,#5af2e0,#10b9a0);color:#042b27}
#rock{background:radial-gradient(circle at 35% 30%,#8f7bff,#3b2a8f 70%);border:6px solid #ffd23f;box-shadow:0 0 40px rgba(255,210,63,.45),0 10px 0 #150a3a}
.chip{background:rgba(0,0,0,.3)}.bar{background:rgba(0,0,0,.35)}.pips b{background:rgba(0,0,0,.35)}.pips b.f{background:linear-gradient(90deg,#22e6b8,#7dffe3)}
.up .ic{filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
input{width:100%;margin:6px 0 10px;padding:10px;border-radius:12px;border:3px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:inherit;font-weight:800}
html:root:root{--bg:#7cd4ff;--card:#fff;--ink:#1d2b4f;--mut:#51648f;--acc:#ff7a1a;--acc2:#27c46b;--line:#1d2b4f;--bar:#dbe9ff;--good:#27c46b;--bad:#ff4040}
body{background:linear-gradient(#4fc3ff,#c9f0ff) fixed}
.hud{background:transparent;backdrop-filter:none}
.pill,.card{background:#fff;border:4px solid #1d2b4f;border-radius:18px;box-shadow:0 6px 0 #1d2b4f}
h2{color:#1d2b4f;text-shadow:none}
button{background:linear-gradient(#ffb347,#ff7a1a);color:#fff;border:3px solid #1d2b4f;border-radius:14px;box-shadow:0 5px 0 #1d2b4f;text-shadow:0 2px 0 rgba(0,0,0,.35);text-transform:uppercase;font-size:13px;letter-spacing:.4px}
button.g{background:linear-gradient(#5be38c,#27c46b);color:#fff;box-shadow:0 5px 0 #1d2b4f}
button.s{background:linear-gradient(#fff,#d6e4ff);color:#1d2b4f;text-shadow:none;box-shadow:0 5px 0 #1d2b4f}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #1d2b4f}
nav{background:#fff;border-top:4px solid #1d2b4f}nav button{font-size:10.5px;padding:8px 1px}nav button.on{background:linear-gradient(#5be38c,#27c46b);color:#fff}
#rock{background:radial-gradient(circle at 35% 30%,#fff,#ffe29a 70%);border:5px solid #1d2b4f;box-shadow:0 10px 0 #1d2b4f}
.chip{background:#eaf2ff;border:2px solid #1d2b4f}
.bar{background:#dbe9ff;border:3px solid #1d2b4f;height:16px}.bar i{background:linear-gradient(#5be38c,#27c46b)}
.pips b{background:#dbe9ff;border:2px solid #1d2b4f}.pips b.f{background:#ffb347}
.pet.on{background:#9af0b9;color:#1d2b4f}
input{border:3px solid #1d2b4f;background:#fff;color:#1d2b4f}
.fl{color:#fff;text-shadow:-2px 0 #1d2b4f,2px 0 #1d2b4f,0 -2px #1d2b4f,0 2px #1d2b4f}
.Secret{border-color:#ff2bd6}.pet.gold{border-color:#ffb703;box-shadow:0 0 14px #ffd23f}
#toast{max-width:92vw;text-align:center;white-space:pre-line;line-height:1.35}
.zones button.ev{background:linear-gradient(180deg,#ff9a3c,#c2410c)!important;color:#fff!important}.pet b{position:absolute;left:4px;top:0;font-size:14px;cursor:pointer}.pet.sel{outline:4px solid var(--bad);outline-offset:-2px}.Exclusive{border-color:#ff5d2e}.pet.Exclusive{box-shadow:0 0 14px #ff5d2e}.Divine{border-color:#00e5ff}.pet.Divine{box-shadow:0 0 12px #00e5ff}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="row">
      <button id="mute" class="s" onclick="toggleMute()" style="padding:10px 12px;font-size:20px">🔊</button><div class="pill">🪙 <span id="coins">0</span><small id="mult"></small></div>
      <div class="pill">🎒 <span id="bagTxt">0/0</span><div class="bar"><i id="bagBar"></i></div></div>
    </div>
    <div class="row" id="evRow" style="margin-top:6px;display:none"><div class="pill">🍁 <span id="leaves">0</span><small id="evmult"></small></div></div>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>
<nav><div id="nav"></div></nav>

<script>
/* ===================== GAME DATA (add updates here) =====================
   To ship a new update: 1) add an entry to UPDATES, 2) add zones to AREAS,
   upgrades to UPGRADES, or pets to PETS. Old saves keep working automatically. */
const KEY = "mineTycoonSave_v1";
const UPDATES = [
  { v: "1.0.0", t: "Grand Opening", n: ["3 mining zones with 9 ores", "6 upgrades, each with a level cap", "Auto Sell with ON/OFF switch", "Pets: hatch up to 12, equip 3", "Auto-save"] },
  { v: "1.1.0", t: "The Frozen Update", n: ["New zone: Frozen Tundra with 3 new ores (unlock for 400K)", "New upgrade: Critical Strike (8 levels, x3 ore clicks)", "New upgrade: Pet Slots (3 levels, equip up to 6 pets)", "Every zone has its own egg with its own pets, and you can only hatch the egg of the zone you are in (Stone, Crystal, Magma, Frost)", "12 new pets, including the Legendary Cosmic Whale", "Daily Gift: claim free coins every 24 hours", "Auto Miner now has an ON/OFF switch", "Releasing Common or Rare pets no longer asks for confirmation (Epic and Legendary still do)"] },
  { v: "1.1.5", t: "Golden Mini Update", n: ["Auto-delete: tap a pet in the odds list (Normal or Golden tab) to delete it automatically when it drops", "New Secret pet: Void Serpent in the Frost Egg (0.1% chance)", "Golden pets: merge 5 identical pets into 1 Golden pet with double bonus", "1% base chance to hatch a Golden pet from any egg", "Odds list can switch between Normal and Golden", "New upgrade: More Storage (5 levels, up to 27 pet slots)", "New upgrade: Golden Luck (6 levels, up to 4% golden chance)"] },
  { v: "1.2.0", t: "The Sky Update", n: ["New zone: Sky Citadel with 3 new ores (unlock for 6M)", "New Sky Egg with 6 new pets, including the Secret Celestial Peacock (0.1%) and the Divine Archangel Lion (0.01%)", "New upgrade: Double Drop (8 levels, ores can drop twice)", "New upgrade: Multi Hatch (2 levels, hatch x3 and then x5)", "Multi Hatch shows every pet you hatched in one list", "Sound effects and music, with a mute button in the top left corner"] },
  { v: "1.3.0", t: "The Exclusive Update", n: ["New rarity: Exclusive", "New pet: Rock (Exclusive) with a 0.001% chance from every egg. It is as strong as your best pet (100%, Golden Rock: 110%). It cannot drop from the Playtime Egg", "New ⏳ Playtime Egg above the Eggs: free, open it every 10 minutes. Only Exclusive pets: Clock Mouse (97%, 75% of your best pet, Golden 85%) and Chrono Turtle (3%, 100% of your best pet, Golden 110%)", "Exclusive pets cannot be used in Golden Merge","Removed the Daily Gift"] },
  { v: "1.4.0", t: "The Farm Update", n: ["New zone: Harvest Valley with 3 new ores (unlock for 80M)", "New Farm Egg with 6 new pets: 1 Rare, 1 Epic, 1 Legendary, 2 Secret (Pumpkin King 0.1%, Sunflower Sprite 0.05%) and 1 Divine (Harvest Stallion 0.005%)", "New 🌱 Farm tab (left of Mine, only visible in Harvest Valley): grow Apple, Banana, Carrot, Strawberry, Tomato, Corn and Grapes. Crops cost coins and take 15 minutes to grow", "Farm upgrades: Fertilizer (faster growing), Bigger Harvest (more crops per harvest) and More Plots", "Use crops from your farm inventory for 5 minute boosts (using more adds more time): Apple +25% coins, Banana +50% pickaxe power, Carrot +25% luck, Strawberry +2% golden chance, Tomato +10% bonus coins when selling, Corn +10% double drop, Grapes +25% pet bonus", "New Exclusive pet in the Playtime Egg: Time Wizard (0.1%, 120% of your best pet, Golden 130%)", "Rock can no longer be found in eggs (you keep the ones you already have)"] },
  { v: "1.4.2", t: "Pet Tools Update", n: ["New Equip Best button in the Pets tab: equips your strongest pets", "Pet locking: tap the 🔓 on a pet to lock it. Locked pets cannot be released, multi deleted or used in Golden Merge until you unlock them", "New Multi Delete: select several pets and delete them at once (locked pets cannot be selected)", "New Merge All button in Golden Merge: merges every group of 5 identical pets into Golden pets in one tap"] },
  { v: "1.5.0", t: "The Autumn Event", n: ["New event zone: Autumn Event, on the left of Stone Quarry (free to enter)", "New currency: 🍁 Maple Leaves. Event ores (Acorn, Mushroom, Pumpkin) sell for Leaves", "4 new Event upgrades paid with Leaves: Rake Power, Leaf Polisher, Lucky Acorn and Egg Discount", "New Autumn Egg (paid with Leaves) with 7 event pets: Common, Rare, Epic, Legendary, Secret (0.1%), Divine (0.005%) and Exclusive (0.00005%)", "Event pets boost your Leaves and give no coin bonus. Normal pets boost coins and give no Leaves bonus", "Equip Best now works per zone type: in the event it equips your best event pets, in normal zones your best coin pets", "One more level for Multi Hatch (x10), More Storage (up to 30 pet slots) and Pet Slots (equip up to 7 pets)", "Exclusive pets with \"% of best\" (Rock, Clock Mouse, Chrono Turtle, Time Wizard and Acorn) now work in both normal zones and the event: they copy your best coin pet for coins and your best event pet for Leaves (they take a slot in both)", "Exclusive event pet Acorn gives 100% of your best event pet (Golden: 110%)"] },
  // Add new updates above this line
];
const VERSION = UPDATES[UPDATES.length - 1].v;

// ores: [name, icon, sell value, spawn weight]
const AREAS = [
  { name: "Stone Quarry", icon: "⛰️", cost: 0, ores: [["Stone","🪨",1,60],["Coal","⚫",3,30],["Copper","🟠",8,10]] },
  { name: "Crystal Cave", icon: "💎", cost: 3000, ores: [["Iron","🔩",14,55],["Silver","⚪",30,30],["Gold","🟡",70,15]] },
  { name: "Magma Core",  icon: "🌋", cost: 40000, ores: [["Ruby","🔴",150,55],["Sapphire","🔵",350,33],["Diamond","💠",900,12]] },
  { name: "Frozen Tundra", icon: "❄️", cost: 400000, ores: [["Frostite","🧊",1100,55],["Moonstone","🌙",2600,33],["Starlight","🌟",7000,12]] },
  { name: "Sky Citadel", icon: "☁️", cost: 6000000, ores: [["Cloudstone","⛅",11000,55],["Skyglass","🔷",26000,33],["Aether","💫",70000,12]] },
  { name: "Harvest Valley", icon: "🌾", cost: 80000000, farm: true, ores: [["Clay","🟤",110000,55],["Amber","🟧",260000,33],["Emerald","💚",700000,12]] },
  { name: "Autumn Event", icon: "🍂", cost: 0, event: true, ores: [["Acorn","🌰",4,60],["Mushroom","🍄",10,30],["Pumpkin","🎃",30,10]] }
];
// max = level cap, cost = base * grow^level
const UPGRADES = [
  { id:"power", name:"Stronger Pickaxe", icon:"⛏️", max:10, base:25,  grow:1.65, desc:"Ores mined per click",   val:l=>1+l,            show:l=>(1+l)+" ores/click" },
  { id:"bag",   name:"Bigger Backpack",  icon:"🎒", max:12, base:40,  grow:1.6,  desc:"Backpack capacity",       val:l=>30+20*l,        show:l=>(30+20*l)+" slots" },
  { id:"auto",  name:"Auto Miner",       icon:"🤖", max:10, base:150, grow:1.7,  desc:"Ores mined every second", val:l=>0.4*l,          show:l=>(0.4*l).toFixed(1)+" ores/s" },
  { id:"value", name:"Ore Polisher",     icon:"✨", max:10, base:100, grow:1.75, desc:"Bonus coins when selling",val:l=>1+0.1*l,        show:l=>"+"+(l*10)+"% coins" },
  { id:"luck",  name:"Lucky Charm",      icon:"🍀", max:8,  base:300, grow:1.8,  desc:"Better chance of rare ores", val:l=>l,           show:l=>"Luck "+l+"/8" },
  { id:"autosell", name:"Auto Sell", icon:"💰", max:5, base:500, grow:2.2, desc:"Sells a full backpack for you", val:l=>l?0.5+0.1*l:0, show:l=>l?"Sells at "+Math.round((0.5+0.1*l)*100)+"% value":"Off" },
  { id:"crit", name:"Critical Strike", icon:"💥", max:8, base:400, grow:1.75, desc:"Chance for a x3 ore click", val:l=>l*4, show:l=>(l*4)+"% crit chance" },
  { id:"slots", name:"Pet Slots", icon:"🐾", max:4, base:5000, grow:4, desc:"Pets you can equip", val:l=>3+l, show:l=>(3+l)+" pets" },
  { id:"storage", name:"More Storage", icon:"📦", max:6, base:3000, grow:2.5, desc:"Pet storage slots", val:l=>12+3*l, show:l=>(12+3*l)+" slots" },
  { id:"goldluck", name:"Golden Luck", icon:"🌟", max:6, base:20000, grow:2.4, desc:"Golden pet chance from eggs", val:l=>0.01+0.005*l, show:l=>(1+0.5*l).toFixed(1)+"% golden chance" },
  { id:"dbl", name:"Double Drop", icon:"🎲", max:8, base:1000, grow:1.8, desc:"Chance for an ore to drop twice", val:l=>l*5, show:l=>(l*5)+"% double drop" },
  { id:"multi", name:"Multi Hatch", icon:"🐣", max:3, base:60000, grow:5, desc:"Hatch several eggs at once", val:l=>[1,3,5,10][l], show:l=>"Hatch x"+[1,3,5,10][l] }
];
const CROPS = [ // 5 minute boost per crop used
  { id:"apple", n:"Apple", i:"🍎", cost:500000, desc:"+25% coins" },
  { id:"banana", n:"Banana", i:"🍌", cost:600000, desc:"+50% stronger pickaxe" },
  { id:"carrot", n:"Carrot", i:"🥕", cost:400000, desc:"+25% luck" },
  { id:"strawberry", n:"Strawberry", i:"🍓", cost:2000000, desc:"+2% golden chance" },
  { id:"tomato", n:"Tomato", i:"🍅", cost:800000, desc:"+10% bonus coins when selling" },
  { id:"corn", n:"Corn", i:"🌽", cost:1000000, desc:"+10% double drop" },
  { id:"grapes", n:"Grapes", i:"🍇", cost:3000000, desc:"+25% pet bonus" }
];
const EVENT_UPS = [ // paid with 🍁 Leaves
  { id:"evpower", ev:true, name:"Rake Power", icon:"🍂", max:8, base:80, grow:1.8, desc:"Extra ores per click (event zone)", val:l=>l, show:l=>"+"+l+" ores/click" },
  { id:"evvalue", ev:true, name:"Leaf Polisher", icon:"🍁", max:10, base:120, grow:1.8, desc:"Bonus Leaves when selling", val:l=>1+0.15*l, show:l=>"+"+(l*15)+"% Leaves" },
  { id:"evluck", ev:true, name:"Lucky Acorn", icon:"🌰", max:5, base:200, grow:2, desc:"Better chance of rare ores (event zone)", val:l=>l, show:l=>"Luck "+l+"/5" },
  { id:"evegg", ev:true, name:"Egg Discount", icon:"🏷️", max:6, base:500, grow:2.5, desc:"Cheaper Autumn Egg", val:l=>1-0.05*l, show:l=>"-"+(l*5)+"% egg price" }
];
const BOOST_MS = 5*60*1000;
const FARM_UPS = [
  { id:"fert", name:"Fertilizer", icon:"🧪", max:5, base:2000000, grow:2.6, desc:"Crop growing time", show:l=>parseFloat((15*(1-0.1*l)).toFixed(1))+" min" },
  { id:"yield", name:"Bigger Harvest", icon:"🧺", max:4, base:3000000, grow:3, desc:"Crops per harvest", show:l=>(1+l)+" per harvest" },
  { id:"plots", name:"More Plots", icon:"🟫", max:3, base:5000000, grow:4, desc:"Farm plots", show:l=>(3+l)+" plots" }
];
const buffOn = id => ((S.buffs||{})[id]||0) > Date.now();
const plotCount = () => 3+lvl("plots");
const growMs = () => 15*60*1000*(1-0.1*lvl("fert"));
const yieldN = () => 1+lvl("yield");
const dblChance = () => U("dbl").val(lvl("dbl")) + (buffOn("corn")?10:0);
const goldChance = () => 0.01+0.005*lvl("goldluck") + (buffOn("strawberry")?0.02:0);
const maxPets = () => 12+3*lvl("storage");
const maxEq = () => 3+lvl("slots");
const EGGS = [ // index = zone index. pool = { petId: weight }. Each zone has its own egg with its own pets
  { n:"Stone Egg",   i:"🥚", cost:1500,    pool:{cat:35,mole:25,fox:15,owl:12,dragon:6,phoenix:2} },
  { n:"Crystal Egg", i:"🔮", cost:12000,   pool:{bat:45,lizard:30,golem:20,stag:5} },
  { n:"Magma Egg",   i:"🌋", cost:120000,  pool:{crab:35,gator:30,bull:25,drake:10} },
  { n:"Frost Egg",   i:"🧊", cost:1200000, pool:{bunny:30,wolf:35,mammoth:25,whale:9.9,void:.1} },

const DEF = { mute:false, del:{}, delg:{}, pt:0, leaves:0, plots:[], inv:{}, buffs:{}, am:true, as:true, coins:0, bag:{}, up:{}, area:0, unlocked:[0], pets:[], mined:0 };
let S = load(), view = "mine", acc = 0;
function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r) return Object.assign(structuredClone(DEF), r); }catch(e){} return structuredClone(DEF); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const fmt = n => n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Math.floor(n).toLocaleString("en-US");
const lvl = id => S.up[id]||0;
const U = id => UPGRADES.find(u=>u.id===id) || FARM_UPS.find(u=>u.id===id) || EVENT_UPS.find(u=>u.id===id);
const cap = () => U("bag").val(lvl("bag"));
const bagCount = () => Object.values(S.bag).reduce((a,b)=>a+b,0);
const ORE = {}, EVORE = {}; AREAS.forEach(a=>a.ores.forEach(o=>{ ORE[o[0]]=o; if(a.event) EVORE[o[0]]=1; }));
// Exclusive pets (f/fg) are "x as strong as your best normal pet"; best = highest bonus among the pets you own
const isEv = p => { const d=PETS.find(x=>x.id===p.id); return !!d.ev && !d.f; };
// "% of best" pets (f) work in BOTH coin zones and the event; other pets only work in their own category
const inCat = (p,ev) => { const d=PETS.find(x=>x.id===p.id); return !!(d.f || !!d.ev===!!ev); };
const onCount = ev => S.pets.filter(x=>x.on&&inCat(x,ev)).length;
const bestPet = ev => S.pets.reduce((b,p)=>{ const d=PETS.find(x=>x.id===p.id); return (d.f || !!d.ev!==!!ev) ? b : Math.max(b, d.m*(p.g?2:1)); },0);
const petVal = (p,ev) => { const d=PETS.find(x=>x.id===p.id); return d.f ? bestPet(ev)*(p.g?d.fg:d.f) : d.m*(p.g?2:1); };
const petMult = () => S.pets.filter(p=>p.on&&inCat(p,false)).reduce((a,p)=>a+petVal(p,false),0) * (buffOn("grapes")?1.25:1);
const evPetMult = () => S.pets.filter(p=>p.on&&inCat(p,true)).reduce((a,p)=>a+petVal(p,true),0) * (buffOn("grapes")?1.25:1);
const coinMult = () => U("value").val(lvl("value")) * (1+petMult()) * (buffOn("apple")?1.25:1) * (buffOn("tomato")?1.1:1);
const evMult = () => U("evvalue").val(lvl("evvalue")) * (1+evPetMult());
const upCost = u => Math.round(u.base*Math.pow(u.grow,lvl(u.id)));

/* ===================== ACTIONS ===================== */
function pickOre(a){
  const L = lvl("luck") + (buffOn("carrot")?2:0) + (a.event?lvl("evluck"):0); // Carrot = +25% of the max luck (8 levels) = +2 levels
  const ws = a.ores.map((o,i)=>o[3]*(1+L*0.25*i));
  let r = Math.random()*ws.reduce((x,y)=>x+y,0);
  for(let i=0;i<ws.length;i++){ if((r-=ws[i])<=0) return a.ores[i]; }
  return a.ores[0];
}
function mine(n, silent){
  let got = 0;
  for(let i=0;i<n;i++){
    if(bagCount()>=cap()){ if(!autoSell()){ if(!silent) toast("Backpack full! Sell your ores"); break; } }
    const o = pickOre(AREAS[S.area]);
    S.bag[o[0]] = (S.bag[o[0]]||0)+1; S.mined++; got++;
    if(bagCount()<cap() && Math.random()*100<dblChance()){ S.bag[o[0]]++; got++; }
  }
  return got;
}
function clickRock(e){
  const crit = Math.random()*100 < U("crit").val(lvl("crit"));
  const base = U("power").val(lvl("power"))*(buffOn("banana")?1.5:1)+(AREAS[S.area].event?lvl("evpower"):0), pw = Math.floor(base)+(Math.random()<base%1?1:0);
  const got = mine(pw*(crit?3:1));
  const r = $("#rock"); r.classList.remove("hit"); void r.offsetWidth; r.classList.add("hit");
  if(got){ sfx(crit?"crit":"mine"); float((crit?"💥 CRIT! +":"+")+got, e.clientX, e.clientY); }
  live();
}
function sellValue(){ return Math.floor(Object.entries(S.bag).reduce((a,[k,c])=>a+(EVORE[k]?0:ORE[k][2]*c),0)*coinMult()); }
function sellLeaves(){ return Math.floor(Object.entries(S.bag).reduce((a,[k,c])=>a+(EVORE[k]?ORE[k][2]*c:0),0)*evMult()); }
function hatchN(k,n){
  const res=[]; for(let i=0;i<n;i++){ const r=hatch(k,true); if(r) res.push(r); }
  if(!res.length) return; save(); render(); toast("You hatched:\n"+res.join("\n"), true);
}
function togDel(id){ const m=oddsGold?S.delg:S.del; m[id]=!m[id]; save(); render(); }
function mergeInfo(){
  const c={}; S.pets.forEach(p=>{ if(!p.g && !p.l && !PETS.find(x=>x.id===p.id).f) c[p.id]=(c[p.id]||0)+1; });
  return Object.keys(c).map(id=>{ const d=PETS.find(x=>x.id===id); return c[id]>=5 ? `<button class="g" onclick="merge('${id}')">${d.i} Merge ${d.n} x5</button>` : `<span class="chip">${d.i} ${d.n} ${c[id]}/5</span>`; }).join("") || "<p>No pets to merge yet.</p>";
}
function merge(id){
  const idx = S.pets.map((p,i)=>({p,i})).filter(x=>x.p.id===id&&!x.p.g&&!x.p.l&&!PETS.find(y=>y.id===id).f).sort((a,b)=>a.p.on-b.p.on).slice(0,5).map(x=>x.i);
  if(idx.length<5||PETS.find(x=>x.id===id).f) return;
  S.pets = S.pets.filter((_,i)=>!idx.includes(i)); S.pets.push({id,on:false,g:true});
  toast("✨ Golden "+PETS.find(x=>x.id===id).n+" created!", true); save(); render();
}
const mergeable = p => !p.g && !p.l && !PETS.find(x=>x.id===p.id).f;
function mergeCount(){ const c={}; S.pets.forEach(p=>{ if(mergeable(p)) c[p.id]=(c[p.id]||0)+1; }); return Object.values(c).reduce((a,n)=>a+Math.floor(n/5),0); }
function mergeAll(){
  let made=0;
  for(const id of [...new Set(S.pets.map(p=>p.id))]){
    while(true){
      const idx = S.pets.map((p,i)=>({p,i})).filter(x=>x.p.id===id&&mergeable(x.p)).sort((a,b)=>a.p.on-b.p.on).slice(0,5).map(x=>x.i);
      if(idx.length<5) break;
      S.pets = S.pets.filter((_,i)=>!idx.includes(i)); S.pets.push({id,on:false,g:true}); made++;
    }
  }
  if(!made) return toast("Nothing to merge yet");
  toast("✨ Created "+made+" Golden pet"+(made>1?"s":"")+"!", true); save(); render();
}
function tog(id){ const k=id==="auto"?"am":"as"; S[k]=!S[k]; save(); render(); }
function openPlaytime(){
  if(Date.now()-S.pt<PTEGG.wait || S.pets.length>=maxPets()) return;
  const L=eggPets(PTEGG); let r=Math.random()*100, pick=L[0].p;
  for(const x of L){ if((r-=x.pct)<=0){ pick=x.p; break; } }
  const gold = Math.random() < goldChance();
  S.pt = Date.now();
  if((gold?S.delg:S.del)[pick.id]){ toast("🗑️ Auto-deleted "+(gold?"✨ Golden ":"")+pick.i+" "+pick.n); save(); render(); return; }
  S.pets.push({id:pick.id,on:false,g:gold});
  toast("You hatched "+(gold?"✨ Golden ":"")+pick.i+" "+pick.n+" ("+pick.r+")!", true); save(); render();
}
function plant(i,id){
  const c=CROPS.find(x=>x.id===id); if(S.plots[i]||S.coins<c.cost) return;
  S.coins-=c.cost; S.plots[i]={c:id,t:Date.now()+growMs()}; sfx("buy"); save(); render();
}
function harvest(i,quiet){
  const p=S.plots[i]; if(!p||p.t>Date.now()) return;
  S.inv[p.c]=(S.inv[p.c]||0)+yieldN(); S.plots[i]=null;
  if(!quiet){ sfx("coin"); save(); render(); }
}
function harvestAll(){ for(let i=0;i<plotCount();i++) harvest(i,true); sfx("coin"); save(); render(); }
function useCrop(id){
  if(!(S.inv[id]>0)) return;
  S.inv[id]--; S.buffs[id]=Math.max(Date.now(),S.buffs[id]||0)+BOOST_MS;
  sfx("magic"); save(); render();
}
function autoSell(){ const l=lvl("autosell"); if(!l||!S.as) return false; const f=U("autosell").val(l), v=Math.floor(sellValue()*f), lv=Math.floor(sellLeaves()*f); S.coins+=v; S.leaves+=lv; S.bag={}; float("+"+(v?"🪙"+fmt(v):"")+(lv?" 🍁"+fmt(lv):"")+" auto",innerWidth/2,120); return true; }
function sell(){
  const v = sellValue(), lv = sellLeaves(); if(!v && !lv) return toast("Nothing to sell");
  S.coins += v; S.leaves += lv; S.bag = {}; float("+"+(v?"🪙"+fmt(v):"")+(lv?" 🍁"+fmt(lv):""), innerWidth/2, 120); save(); render();
}
function buyUp(id){
  const u = U(id), c = upCost(u), cur = u.ev ? S.leaves : S.coins;
  if(lvl(id)>=u.max || cur<c) return;
  if(u.ev) S.leaves -= c; else S.coins -= c;
  S.up[id] = lvl(id)+1; save(); render();
}
function zone(i){
  const a = AREAS[i];
  if(!S.unlocked.includes(i) && !a.event){
    if(S.coins<a.cost) return toast("Need 🪙"+fmt(a.cost));
    S.coins -= a.cost; S.unlocked.push(i);
  }
  S.area = i; save(); render();
}
function hatch(k,quiet){
  const g=EGGS[k];
  if(k!==S.area || eggCur(g)<eggCost(g) || S.pets.length>=maxPets()) return;
  if(g.ev) S.leaves -= eggCost(g); else S.coins -= eggCost(g);
  let r = Math.random()*100, pick = eggPets(g)[0].p;
  for(const x of eggPets(g)){ if((r-=x.pct)<=0){ pick = x.p; break; } }
  const gold = Math.random() < goldChance();
  const nm = (gold?"✨ Golden ":"")+pick.i+" "+pick.n;
  if((gold?S.delg:S.del)[pick.id]){ if(quiet) return "🗑️ "+nm; toast("🗑️ Auto-deleted "+nm); save(); render(); return; }
  S.pets.push({id:pick.id,on:false,g:gold});
  if(quiet) return nm+" ("+pick.r+")";
  toast("You hatched "+nm+" ("+pick.r+")!", true); save(); render();
}
let multiDel = false, selDel = new Set();
function lockPet(i,e){ e.stopPropagation(); const p=S.pets[i]; p.l=!p.l; selDel.delete(i); sfx("click"); save(); render(); }
function equipBest(){
  const ev = !!AREAS[S.area].event, max = maxEq();
  // "% of best" pets take a slot in both categories, so keep the other category within its limit
  const otherOn = S.pets.filter(p=>p.on&&!PETS.find(x=>x.id===p.id).f&&inCat(p,!ev)).length;
  let fLeft = Math.max(0, max-otherOn);
  const order = [];
  S.pets.map((p,i)=>({i,v:petVal(p,ev),f:!!PETS.find(x=>x.id===p.id).f,ok:inCat(p,ev)})).filter(x=>x.ok).sort((a,b)=>b.v-a.v).forEach(x=>{
    if(order.length>=max) return;
    if(x.f){ if(fLeft<=0) return; fLeft--; }
    order.push(x.i);
  });
  S.pets.forEach((p,i)=>{ if(inCat(p,ev)) p.on=order.includes(i); });
  toast("Equipped your "+order.length+" best "+(ev?"event (🍁)":"coin (🪙)")+" pets!", true); sfx("magic"); save(); render();
}
function toggleMulti(){ multiDel=!multiDel; selDel.clear(); render(); }
function delSelected(){
  const idx=[...selDel].filter(i=>S.pets[i]&&!S.pets[i].l);
  if(!idx.length) return toast("Select some pets first");
  if(!confirm("Delete "+idx.length+" pet"+(idx.length>1?"s":"")+" forever?")) return;
  S.pets = S.pets.filter((_,i)=>!idx.includes(i)); selDel.clear(); multiDel=false;
  toast("🗑️ Deleted "+idx.length+" pet"+(idx.length>1?"s":"")); save(); render();
}
function togglePet(i){
  if(multiDel){ if(S.pets[i].l) return toast("This pet is locked 🔒"); selDel.has(i)?selDel.delete(i):selDel.add(i); render(); return; }
  const p = S.pets[i];
  if(!p.on){ const d=PETS.find(x=>x.id===p.id); if((d.f?[false,true]:[!!d.ev]).some(c=>onCount(c)>=maxEq())) return toast("Only "+maxEq()+" pets can be equipped"); }
  p.on = !p.on; save(); render();
}
function release(i,e){ e.stopPropagation(); if(S.pets[i].l) return toast("Unlock this pet first 🔒"); const d=PETS.find(x=>x.id===S.pets[i].id); if(((d.r==="Common"||d.r==="Rare")&&!S.pets[i].g)||confirm("Release this "+(S.pets[i].g?"Golden ":"")+d.r+" pet forever?")){ S.pets.splice(i,1); save(); render(); } }

    }
const VIEWS = {
  mine(){
    const a = AREAS[S.area];
    return `<div class="zones">${[...AREAS.keys()].sort((x,y)=>(AREAS[y].event?1:0)-(AREAS[x].event?1:0)).map(i=>{ const z=AREAS[i], un=S.unlocked.includes(i)||z.event; return `<button class="${i===S.area?"on ":""}${z.event?"ev":un?"s":""}" onclick="zone(${i})">${z.icon} ${z.name}${z.event?"":un?"":"<br>🔒 🪙"+fmt(z.cost)}</button>`; }).join("")}</div>
    <div id="rockWrap"><button id="rock" onclick="clickRock(event)">${a.icon}</button></div>
    <div class="card"><h2>Ores here</h2><div class="grid">${a.ores.map(o=>`<span class="chip">${o[1]} ${o[0]} · ${a.event?"🍁":"🪙"}${o[2]}</span>`).join("")}</div></div>
    <div class="card"><h2>Backpack</h2><div class="grid" id="bagList"></div><p></p><button class="g" id="sellBtn" onclick="sell()"></button></div>`;
  },
  up(){ return UPGRADES.map(upCard).join("") + `<h2 style="margin:14px 4px 0">🍂 Autumn Event upgrades</h2><p style="margin:0 4px 6px">Paid with 🍁 Leaves. The mining ones only work in the event zone.</p>` + EVENT_UPS.map(upCard).join(""); },
  pets(){
    const evz = !!AREAS[S.area].event, eq = onCount(evz);
    const left = Math.max(0, PTEGG.wait-(Date.now()-S.pt)), full = S.pets.length>=maxPets(), mm = Math.floor(left/60000), ss = String(Math.floor(left%60000/1000)).padStart(2,"0");
    return `<div class="card"><h2>🥚 Eggs</h2><p>Storage ${S.pets.length}/${maxPets()} · Equipped ${eq}/${maxEq()} · Bonus +${Math.round((evz?evPetMult():petMult())*100)}% ${evz?"🍁 Leaves":"🪙 Coins"}</p>${(()=>{const g=EGGS[S.area],k=S.area;return `<div class="up" style="margin-top:10px"><div class="ic">${g.i}</div><div class="mid"><b>${g.n}</b><p>Found in ${AREAS[k].name}. Switch zones to hatch other eggs.</p></div><button ${eggCur(g)<eggCost(g)||S.pets.length>=maxPets()?"disabled":""} onclick="hatch(${k})">${eggIcon(g)} ${fmt(eggCost(g))}</button>${lvl("multi")?`<button class="g" ${eggCur(g)<eggCost(g)*[1,3,5,10][lvl("multi")]||S.pets.length+[1,3,5,10][lvl("multi")]>maxPets()?"disabled":""} onclick="hatchN(${k},${[1,3,5,10][lvl("multi")]})">x${[1,3,5,10][lvl("multi")]}</button>`:""}</div>`})()}<div class="up" style="margin-top:14px;padding-top:10px;border-top:2px dashed rgba(128,128,128,.4)"><div class="ic">${PTEGG.i}</div><div class="mid"><b>${PTEGG.n}</b><p>Free every 10 minutes. Only Exclusive pets!</p></div><button class="${left||full?"":"g"}" ${left||full?"disabled":""} onclick="openPlaytime()">${left?mm+":"+ss:full?"Storage full":"Open"}</button></div></div>
    <div class="card"><h2>✨ Golden Merge</h2><p>Combine 5 identical pets into 1 Golden pet with double bonus.</p><button class="g" style="margin:8px 0" ${mergeCount()?"":"disabled"} onclick="mergeAll()">✨ Merge All (${mergeCount()})</button><div class="grid">${mergeInfo()}</div></div>
    <div class="card"><h2>Your pets</h2>${S.pets.length?`<div class="row" style="margin:8px 0;flex-wrap:wrap">${multiDel?`<button class="g" style="flex:1" onclick="delSelected()">🗑️ Delete selected (${selDel.size})</button><button class="s" style="flex:1" onclick="toggleMulti()">Cancel</button>`:`<button class="g" style="flex:1" onclick="equipBest()">⭐ Equip Best</button><button class="s" style="flex:1" onclick="toggleMulti()">🗑️ Multi Delete</button>`}</div>`:""}${S.pets.length?S.pets.map((p,i)=>{const d=PETS.find(x=>x.id===p.id);return `<div class="pet ${d.r} ${p.on?"on":""} ${p.g?"gold":""} ${selDel.has(i)?"sel":""}" onclick="togglePet(${i})"><b onclick="lockPet(${i},event)">${p.l?"🔒":"🔓"}</b>${p.l?"":`<u onclick="release(${i},event)">✕</u>`}<span>${d.i}</span>${p.g?"Golden ":""}${d.n}<br>${d.f?Math.round((p.g?d.fg:d.f)*100)+"% of best<br>(+"+Math.round(petVal(p,false)*100)+"% 🪙 · +"+Math.round(petVal(p,true)*100)+"% 🍁)":"+"+Math.round(petVal(p)*100)+"%"+(d.ev?" 🍁":" 🪙")} · ${d.r}</div>`}).join(""):"<p>No pets yet. Hatch an egg!</p>"}
    <p>${multiDel?"Tap pets to select them for deletion.":"Tap a pet to equip or unequip it. Tap 🔓 to lock it."}</p></div>
    <div class="card"><h2>${EGGS[S.area].n} odds</h2><div class="row" style="margin-bottom:8px"><button style="flex:1" class="${oddsGold?"s":""}" onclick="oddsGold=false;render()">Normal</button><button style="flex:1" class="${oddsGold?"":"s"}" onclick="oddsGold=true;render()">✨ Golden</button></div><p>Tap a pet to auto-delete it when it drops (🗑️).</p><div class="grid">${eggPets(EGGS[S.area]).map(x=>`<span class="chip" style="cursor:pointer;${(oddsGold?S.delg:S.del)[x.p.id]?"opacity:.5;text-decoration:line-through":""}" onclick="togDel('${x.p.id}')">${(oddsGold?S.delg:S.del)[x.p.id]?"🗑️ ":""}${x.p.i} ${oddsGold?"Golden ":""}${x.p.n} · ${x.p.r} · ${fp(x.pct*(oddsGold?goldChance():1-goldChance()))}%</span>`).join("")}</div></div>
    <div class="card"><h2>⏳ Playtime Egg odds</h2><div class="row" style="margin-bottom:8px"><button style="flex:1" class="${oddsGold?"s":""}" onclick="oddsGold=false;render()">Normal</button><button style="flex:1" class="${oddsGold?"":"s"}" onclick="oddsGold=true;render()">✨ Golden</button></div><p>Tap a pet to auto-delete it when it drops (🗑️).</p><div class="grid">${eggPets(PTEGG).map(x=>`<span class="chip" style="cursor:pointer;${(oddsGold?S.delg:S.del)[x.p.id]?"opacity:.5;text-decoration:line-through":""}" onclick="togDel('${x.p.id}')">${(oddsGold?S.delg:S.del)[x.p.id]?"🗑️ ":""}${x.p.i} ${oddsGold?"Golden ":""}${x.p.n} · ${x.p.r} · ${fp(x.pct*(oddsGold?goldChance():1-goldChance()))}%</span>`).join("")}</div></div>`;
  },
  farm(){
    const now=Date.now(), n=plotCount();
    const left = t => { const q=Math.max(0,Math.ceil(t/1000)); return Math.floor(q/60)+":"+String(q%60).padStart(2,"0"); };
    const ready = Array.from({length:n},(_,i)=>S.plots[i]).filter(p=>p&&p.t<=now).length;
    const boosts = CROPS.filter(c=>buffOn(c.id));
    return `<div class="card"><h2>⚡ Active boosts</h2><div class="grid">${boosts.length?boosts.map(c=>`<span class="chip">${c.i} ${c.desc} · ${left(S.buffs[c.id]-now)}</span>`).join(""):"<p>No boosts active. Use crops from your inventory!</p>"}</div></div>
    <div class="card"><h2>🌱 Plots</h2><p>Growing takes ${parseFloat((growMs()/60000).toFixed(1))} min · You get ${yieldN()} per harvest</p>
    ${Array.from({length:n},(_,i)=>{ const p=S.plots[i]; if(!p) return `<div style="margin:12px 0"><b>Plot ${i+1} · empty</b><div class="grid" style="margin-top:6px">${CROPS.map(c=>`<button class="s" style="padding:6px 8px" ${S.coins<c.cost?"disabled":""} onclick="plant(${i},'${c.id}')">${c.i}<br>🪙${fmt(c.cost)}</button>`).join("")}</div></div>`;
      const c=CROPS.find(x=>x.id===p.c), rd=p.t<=now;
      return `<div class="up" style="margin:12px 0"><div class="ic">${c.i}</div><div class="mid"><b>Plot ${i+1} · ${c.n}</b><p>${rd?"Ready to harvest!":"Growing… "+left(p.t-now)}</p></div><button class="${rd?"g":""}" ${rd?"":"disabled"} onclick="harvest(${i})">${rd?"Harvest":"🌱"}</button></div>`; }).join("")}
    ${ready>1?`<button class="g" onclick="harvestAll()">Harvest all (${ready})</button>`:""}</div>
    <div class="card"><h2>🧺 Inventory</h2><p>Each crop you use gives its boost for 5 minutes. Using more adds more time.</p>${CROPS.map(c=>{ const k=S.inv[c.id]||0; return `<div class="up" style="margin:10px 0"><div class="ic">${c.i}</div><div class="mid"><b>${c.n} ×${k}</b><p>${c.desc}${buffOn(c.id)?" · ⏱️ "+left(S.buffs[c.id]-now):""}</p></div><button ${k?"":"disabled"} onclick="useCrop('${c.id}')">Use</button></div>`; }).join("")}</div>
    <h2 style="margin:14px 4px 0">Farm upgrades</h2>${FARM_UPS.map(upCard).join("")}`;
  },
  news(){
    return [...UPDATES].reverse().map(u=>`<div class="card"><h2><span class="ver">v${u.v}</span> ${u.t}</h2>${u.n.map(x=>`<p>• ${x}</p>`).join("")}</div>`).join("")
    ;
  }
};
const getTabs = () => [...(AREAS[S.area].farm?[["farm","🌱 Farm"]]:[]),["mine","⛏️ Mine"],["up","⬆️ Upgrades"],["pets","🐾 Pets"],["news","📜 Updates"]];
function render(){
  if(view==="farm" && !AREAS[S.area].farm) view="mine";
  $("#nav").innerHTML = getTabs().map(t=>`<button class="${t[0]===view?"on":""}" onclick="view='${t[0]}';render()">${t[1]}</button>`).join("");
  $("#view").innerHTML = VIEWS[view]();
  live();
}
function live(){
  $("#mute").textContent = S.mute ? "🔇" : "🔊";
  $("#coins").textContent = fmt(S.coins);
  $("#mult").textContent = "x"+coinMult().toFixed(2)+" coin multiplier";
  $("#evRow").style.display = (AREAS[S.area].event||S.leaves>0) ? "flex" : "none"; $("#leaves").textContent = fmt(S.leaves); $("#evmult").textContent = "x"+evMult().toFixed(2)+" leaf multiplier";
  const b = bagCount(), c = cap();
  $("#bagTxt").textContent = b+"/"+c; $("#bagBar").style.width = (b/c*100)+"%";
  $("#bagBar").style.background = b>=c ? "var(--bad)" : "var(--acc2)";
  if(view==="mine"){
    $("#bagList").innerHTML = b ? Object.entries(S.bag).map(([k,n])=>`<span class="chip">${ORE[k][1]} ${k} ×${n}</span>`).join("") : "<p>Empty. Tap the rock!</p>";
    const sb = $("#sellBtn"); const c1=sellValue(), l1=sellLeaves(); sb.textContent = "Sell all"+(c1?" · 🪙 "+fmt(c1):"")+(l1?" · 🍁 "+fmt(l1):""); sb.disabled = !b;
  }
}

/* ===================== AUDIO (all synthesized, no files) ===================== */
let AC, master, mg, nextT = 0, bar = 0;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = S.mute?0:.5; master.connect(AC.destination); mg = AC.createGain(); mg.gain.value = .6; mg.connect(master); nextT = AC.currentTime+.1; }catch(e){} }
  if(AC && AC.state==="suspended") AC.resume();
  return AC;
}
function tone(f,t0,d,type,v,dest){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"square"; o.frequency.value=f;
  g.gain.setValueAtTime(v||.15,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g); g.connect(dest||master); o.start(t0); o.stop(t0+d+.02);
}
function sfx(n,tier,gold){
  if(S.mute || !audio()) return; const t=AC.currentTime;
  if(n==="mine") tone(160+Math.random()*80,t,.07,"triangle",.3);
  else if(n==="crit") [440,660,880].forEach((f,i)=>tone(f,t+i*.07,.14,"square",.14));
  else if(n==="coin"){ tone(988,t,.08,"square",.12); tone(1319,t+.08,.25,"square",.12); }
  else if(n==="buy") [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.15,"square",.12));
  else if(n==="magic") [659,784,988,1319,1568].forEach((f,i)=>tone(f,t+i*.08,.2,"triangle",.2));
  else if(n==="click") tone(600,t,.04,"square",.08);
  else if(n==="del"){ tone(300,t,.1,"triangle",.2); tone(200,t+.08,.15,"triangle",.2); }
  else if(n==="err") tone(120,t,.2,"sawtooth",.15);
  else if(n==="hatch"){
    [0,1,2].forEach(i=>tone(200+i*50,t+i*.13,.1,"triangle",.25));
    const sc=[523,659,784,1047,1319,1568];
    for(let i=0;i<Math.min(2+tier,6);i++) tone(sc[i],t+.45+i*.09,.3,"square",.12);
    if(gold) tone(2093,t+.9,.5,"sine",.15);
  }
}
const CH = [[57,60,64],[53,57,60],[60,64,67],[55,59,62]], mf = m => 440*Math.pow(2,(m-69)/12);
function playBar(t,b){
  const c = CH[b%4];
  for(let i=0;i<8;i++) tone(mf(c[[0,1,2,1,0,1,2,1][i]]+12),t+i*.2,.18,"triangle",.09,mg);
  tone(mf(c[0]-12),t,.7,"sine",.22,mg); tone(mf(c[0]-12),t+.8,.7,"sine",.22,mg);
}
setInterval(()=>{ if(S.mute||!AC) return; while(nextT<AC.currentTime+2.5){ playBar(nextT,bar++); nextT+=1.6; } },500);
function toggleMute(){
  S.mute = !S.mute; save();
  if(audio()){ master.gain.value = S.mute?0:.5; if(!S.mute){ nextT = AC.currentTime+.1; sfx("buy"); } }
  live();
}
addEventListener("pointerdown",()=>{ if(!S.mute) audio(); });
addEventListener("click",e=>{ if(e.target.closest && e.target.closest("nav button")) sfx("click"); });
function wrap(name,fn){ const o=window[name]; window[name]=function(...a){ return fn(o,a); }; }
wrap("sell",(o,a)=>{ const c=S.coins+S.leaves; o(...a); if(S.coins+S.leaves>c) sfx("coin"); });
wrap("buyUp",(o,a)=>{ const c=S.coins+S.leaves; o(...a); if(S.coins+S.leaves<c) sfx("buy"); });
wrap("zone",(o,a)=>{ const c=S.coins, z=S.area; o(...a); if(S.coins<c) sfx("buy"); else if(S.area!==z) sfx("click"); });
wrap("mergeAll",(o,a)=>{ const n=S.pets.length; o(...a); if(S.pets.length<n) sfx("magic"); });
wrap("merge",(o,a)=>{ const n=S.pets.length; o(...a); if(S.pets.length<n) sfx("magic"); });
wrap("autoSell",(o,a)=>{ const r=o(...a); if(r) sfx("coin"); return r; });
wrap("toast",(o,a)=>{
  o(...a); const t=String(a[0]);
  if(/hatched/.test(t)) sfx("hatch",/Exclusive/.test(t)||/Divine/.test(t)?5:/Secret/.test(t)?4:/Legendary/.test(t)?3:/Epic/.test(t)?2:/Rare/.test(t)?1:0,/Golden/.test(t));
  else if(t.indexOf("🗑")===0) sfx("del");
  else if(!a[1]) sfx("err");
});

/* ===================== LOOP ===================== */
setInterval(()=>{
  const r = U("auto").val(lvl("auto"));
  if(r>0 && S.am){ acc += r*0.1; while(acc>=1){ acc--; if(!mine(1,true)){ acc=0; break; } } live(); }
},100);
setInterval(()=>{ if(view==="up"||view==="pets"||view==="farm") render(); else live(); save(); },1000);
render();
</script>
</body>
